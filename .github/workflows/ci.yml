name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tailorly
          POSTGRES_PASSWORD: tailorly
          POSTGRES_DB: tailorly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://tailorly:tailorly@localhost:5432/tailorly
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - name: Format check
        run: uv run ruff format --check . && uv run ruff check . && uv run djlint --check templates && npx prettier --check .
      - name: Vendored files match package.json
        run: npm run vendor && test -z "$(git status --porcelain --untracked-files=all -- static/vendor)"
      - run: uv run python manage.py check
      - run: uv run python manage.py migrate --noinput
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest --cov --cov-report=term-missing

  secrets:
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_VERSION: 1.10.1
      BETTERLEAKS_SHA256: c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install betterleaks
        run: |
          curl -sSfL -o betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  betterleaks.tar.gz" | sha256sum --check
          tar -xzf betterleaks.tar.gz betterleaks
          sudo install betterleaks /usr/local/bin/betterleaks
          rm betterleaks betterleaks.tar.gz
          betterleaks version
      - name: Scan full git history
        run: betterleaks git . --redact --verbose --exit-code 1 --config .betterleaks.toml
