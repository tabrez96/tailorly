<nav class="seg" aria-label="Period">
    <div class="seg__track">
        {% for s in segments %}
            <a class="seg__opt"
               id="{{ s.id }}"
               href="{{ s.url }}"
               {% if s.selected %}aria-current="true"{% endif %}
               hx-get="{{ s.url }}"
               hx-target="#page"
               hx-sync="#page:replace"
               hx-replace-url="true">{{ s.label }}</a>
        {% endfor %}
    </div>
</nav>
<div class="week-picker">
    <a class="week-picker__btn"
       id="period-prev"
       href="{{ prev_url }}"
       hx-get="{{ prev_url }}"
       hx-target="#page"
       hx-sync="#page:replace"
       hx-replace-url="true"
       aria-label="Previous">{% include "components/icon.html" with name="chevron-back" %}</a>
    <p class="t-body">
        <strong>{{ label }}</strong>
    </p>
    {% if next_url %}
        <a class="week-picker__btn"
           id="period-next"
           href="{{ next_url }}"
           hx-get="{{ next_url }}"
           hx-target="#page"
           hx-sync="#page:replace"
           hx-replace-url="true"
           aria-label="Next">{% include "components/icon.html" with name="chevron-right" %}</a>
    {% else %}
        <span class="week-picker__btn"
              id="period-next"
              aria-disabled="true"
              aria-label="Next">{% include "components/icon.html" with name="chevron-right" %}</span>
    {% endif %}
</div>
