<svg class="icon"
     data-icon="{{ name }}"
     width="24"
     height="24"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.9"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true"
     focusable="false">
    {% if name == "house" %}
        <path d="M3 10.5 12 3l9 7.5" />
        <path d="M5 9v11h14V9" />
        <path d="M10 20v-6h4v6" />
    {% elif name == "list" %}
        <rect x="5" y="3" width="14" height="18" rx="2" />
        <path d="M9 8h6M9 12h6M9 16h4" />
    {% elif name == "people" %}
        <circle cx="9" cy="8" r="3.5" />
        <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
        <path d="M16 4.6a3.5 3.5 0 0 1 0 6.8" />
        <path d="M18 14.3c2.1.7 3.5 2.8 3.5 5.7" />
    {% elif name == "hanger" %}
        <path d="M10 5a2 2 0 1 1 2 2v1.5" />
        <path d="M12 8.5 3.6 15.2A1.6 1.6 0 0 0 4.6 18h14.8a1.6 1.6 0 0 0 1-2.8Z" />
    {% elif name == "spool" %}
        <path d="M6 3h12M6 21h12" />
        <rect x="8" y="6" width="8" height="12" rx="1" />
        <path d="m8 9.5 8 2M8 13.5l8 2" />
    {% elif name == "badge" %}
        <rect x="4" y="3" width="16" height="18" rx="2.5" />
        <path d="M10 3v2h4V3" />
        <circle cx="12" cy="10.5" r="2.5" />
        <path d="M8 17c.6-1.8 2.1-2.8 4-2.8s3.4 1 4 2.8" />
    {% elif name == "bars" %}
        <path d="M5 20v-8M12 20V5M19 20v-5" />
    {% elif name == "stopwatch" %}
        <circle cx="12" cy="13.5" r="7.5" />
        <path d="M12 13.5V10M10 3h4M18.5 6.5l-1.3 1.3" />
    {% elif name == "wallet" %}
        <path d="M17 7V5H6a2 2 0 0 0 0 4h13a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V7" />
        <path d="M16 14.5h.01" />
    {% elif name == "chevron-back" %}
        <path d="m15 5-7 7 7 7" />
    {% elif name == "chevron-right" %}
        <path d="m9 5 7 7-7 7" />
    {% elif name == "plus" %}
        <path d="M12 5v14M5 12h14" />
    {% elif name == "camera" %}
        <path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.3l1.6-2.5h5.2L16.2 7h2.3A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5Z" />
        <circle cx="12" cy="12.8" r="3.3" />
    {% elif name == "drag" %}
        <path d="M5 8h14M5 12h14M5 16h14" />
    {% elif name == "garment" %}
        <path d="M8.5 4 3 7l2 4 2-1v10h10V10l2 1 2-4-5.5-3a3.5 3.5 0 0 1-7 0Z" />
    {% elif name == "chat" %}
        <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.2A8 8 0 1 1 20 11.5Z" />
    {% elif name == "bag" %}
        <path d="M5 8h14l-1 12H6Z" />
        <path d="M9 10V7a3 3 0 0 1 6 0v3" />
    {% elif name == "fabric" %}
        <rect x="4" y="6" width="16" height="12" rx="2" />
        <path d="M8 6v12" />
        <path d="M8 9.5c-2 0-3 1-3 2.5s1 2.5 3 2.5" />
    {% elif name == "notions" %}
        <circle cx="8.5" cy="12" r="4" />
        <circle cx="15.5" cy="12" r="4" />
    {% endif %}
</svg>
