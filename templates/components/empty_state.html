<div class="empty">
    <div class="icon-tile icon-tile--lg">{% include "components/icon.html" with name=icon %}</div>
    <h2 class="t-sheet empty__title">{{ title }}</h2>
    {% if text %}<p class="muted empty__text">{{ text }}</p>{% endif %}
    {% if button %}<button class="btn btn--primary"
                           type="button"{% if button_sheet %} id="{{ button_id }}" hx-get="{{ button_sheet }}" hx-target="#sheet"{% endif %}>{{ button }}</button>{% endif %}
</div>
