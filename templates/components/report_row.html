<nav class="fchips" aria-label="Reports">
    {% for c in report_row %}
        <a class="fchip"
           id="{{ c.id }}"
           href="{{ c.url }}"
           hx-get="{{ c.url }}"
           hx-target="#page"
           hx-sync="#page:replace"
           hx-push-url="true"
           {% if c.selected %}aria-current="true"{% endif %}>{{ c.label }}</a>
    {% endfor %}
</nav>
