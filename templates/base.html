{% load static %}
<!DOCTYPE html>
<html lang="en"{% if theme %} data-theme="{{ theme }}"{% endif %}>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <title>{% block title %}Tailorly{% endblock %}</title>
        <link rel="icon" href="{% static 'brand/mark.svg' %}" type="image/svg+xml">
        <link rel="icon"
              href="{% static 'brand/favicon-32.png' %}"
              sizes="32x32"
              type="image/png">
        <link rel="apple-touch-icon"
              href="{% static 'brand/apple-touch-icon.png' %}">
        <link rel="manifest" href="{% url 'manifest' %}">
        <link rel="preload"
              href="{% static 'vendor/fonts/plus-jakarta-sans-latin.woff2' %}"
              as="font"
              type="font/woff2"
              crossorigin>
        <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
        <link rel="stylesheet" href="{% static 'css/components.css' %}">
        {% block head_scripts %}{% endblock %}
    </head>
    <body {% block body_attrs %}{% endblock %}>
        {% block content %}{% endblock %}
    </body>
</html>
