{% if bar %}
    {% if bar.action or bar.rework %}
        <div class="action-bar" id="order-bar">
            {% if bar.rework %}
                <button class="btn {% if bar.action %}btn--tonal{% else %}btn--primary{% endif %}"
                        id="add-rework"
                        type="button"
                        hx-get="{{ rework_url }}"
                        hx-target="#sheet">+ Add rework</button>
            {% endif %}
            {% if bar.action == "ready" %}
                <button class="btn btn--primary"
                        id="mark-ready"
                        type="button"
                        hx-get="{{ ready_url }}"
                        hx-target="#sheet">Mark ready</button>
            {% elif bar.action == "deliver" and bar.sheet %}
                <button class="btn btn--primary"
                        id="mark-delivered"
                        type="button"
                        hx-get="{{ deliver_url }}"
                        hx-target="#sheet">Mark delivered</button>
            {% elif bar.action == "deliver" %}
                <form method="post"
                      action="{{ deliver_url }}"
                      hx-post="{{ deliver_url }}"
                      hx-target="#sheet"
                      hx-sync="this:drop"
                      {% if bar.confirm %}hx-confirm="{{ bar.confirm }}"{% endif %}>
                    {% csrf_token %}
                    {% if bar.confirm %}<input type="hidden" name="confirmed" value="1">{% endif %}
                    <button class="btn btn--primary" id="mark-delivered" type="submit">Mark delivered</button>
                </form>
            {% endif %}
        </div>
    {% endif %}
{% endif %}
