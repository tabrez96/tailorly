{% load ui %}
{% include "components/header.html" with title=title back_url=back_url %}
{% error_summary form "change your password" %}
{% if saved %}<p role="status">Password changed.</p>{% endif %}
<form method="post" hx-post="{% url 'change_password' %}" hx-target="#page">
    {% csrf_token %}
    {% field form.old_password %}
    {% field form.new_password1 %}
    {% field form.new_password2 %}
    <button type="submit" class="btn btn--primary">Change password</button>
</form>
