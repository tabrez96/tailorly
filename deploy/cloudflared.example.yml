# Example only. Copy to /etc/cloudflared/config.yml and replace the placeholders.
# The credentials file is created by `cloudflared tunnel create` and stays outside the repo.
tunnel: YOUR-TUNNEL-ID
credentials-file: /etc/cloudflared/YOUR-TUNNEL-ID.json
ingress:
  - hostname: shop.example.com
    path: ^/mcp(/.*)?$
    service: http://127.0.0.1:8001
  - hostname: shop.example.com
    service: http://127.0.0.1:8000
  - service: http_status:404
